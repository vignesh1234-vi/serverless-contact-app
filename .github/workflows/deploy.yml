name: Deploy Serverless Application

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::701179923193:role/GitHubLambdaDeploymentPolicy
          aws-region: us-east-1

      # Remember the currently working PROD version
      - name: Save current PROD version
        run: |
          OLD_VERSION=$(aws lambda get-alias \
            --function-name serverless-application \
            --name PROD \
            --query 'FunctionVersion' \
            --output text)

          echo "OLD_VERSION=$OLD_VERSION" >> $GITHUB_ENV

      # Package the Lambda application
      - name: Package Lambda application
        run: |
          zip deployment.zip lambda_function.py contactus.html success.html

      # Upload new code to Lambda
      - name: Deploy Lambda function
        run: |
          aws lambda update-function-code \
            --function-name serverless-application \
            --zip-file fileb://deployment.zip

      # Wait for Lambda to finish updating
      - name: Wait for Lambda update
        run: |
          aws lambda wait function-updated \
            --function-name serverless-application

      # Create a permanent version of the new code
      - name: Publish new Lambda version
        run: |
          VERSION=$(aws lambda publish-version \
            --function-name serverless-application \
            --query 'Version' \
            --output text)

          echo "VERSION=$VERSION" >> $GITHUB_ENV

      # Move PROD to the new version
      - name: Move PROD to new version
        run: |
          aws lambda update-alias \
            --function-name serverless-application \
            --name PROD \
            --function-version $VERSION

      # Test the application
      - name: Test application
        run: |
          curl -f "https://wfeac5lwb4.execute-api.us-east-1.amazonaws.com/dev"


      # Roll back if a later step fails
      - name: Rollback on failure
        if: failure()
        run: |
          echo "Deployment test failed. Rolling back to version $OLD_VERSION"

          aws lambda update-alias \
            --function-name serverless-application \
            --name PROD \
            --function-version $OLD_VERSION

          echo "Rollback completed. PROD is now using version $OLD_VERSION"
